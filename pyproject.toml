[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madvid"
version = "0.1.0"
description = "MADVID: AI Product Introduction Video Generator"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MADVID Contributors" }]
license = { text = "MIT" }
keywords = ["video", "ai", "product-demo", "cli", "skill"]
dependencies = [
  "Pillow>=10.0.0",
  "imageio>=2.34.0",
  "imageio-ffmpeg>=0.5.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
madvid = "madvid.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["madvid*"]
